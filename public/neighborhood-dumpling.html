<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>饺子店街区沙盘 · 留白 WriteSpace</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; overflow: hidden; background: #eae2d3;
           font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    canvas { display: block; }
    /* —— 覆盖层 UI 统一采用 WriteSpace 设计令牌：纸白底 / 墨色 #1d2924 / 灰绿 #65736d / 主绿 #28735a —— */
    #tip { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border-radius: 9px;
           background: rgba(255,255,255,.88); color: #1d2924; font-size: 13px;
           border: 1px solid #e3e9e2; box-shadow: 0 12px 36px rgba(33,55,42,.08);
           letter-spacing: .02em; pointer-events: none; }
    #ui { position: fixed; left: 16px; bottom: 54px; padding: 10px 14px; border-radius: 9px;
          background: rgba(255,255,255,.9); color: #1d2924; font-size: 13px;
          border: 1px solid #e3e9e2; box-shadow: 0 12px 36px rgba(33,55,42,.08);
          display: flex; align-items: center; gap: 10px; }
    #ui input { width: 220px; accent-color: #28735a; cursor: pointer; }
    #ui button { font: inherit; padding: 5px 12px; border-radius: 9px; cursor: pointer;
                 border: 1px solid #e3e9e2; background: #fff; color: #1d2924; font-weight: 650; }
    #ui button.on { background: #28735a; border-color: #28735a; color: #fff; }
    /* 漫游模式：掉锁后的恢复提示 */
    #walkHint { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 15;
                padding: 6px 14px; border-radius: 9px; display: none; pointer-events: none;
                background: rgba(29,41,36,.85); color: #fff; font-size: 12.5px; letter-spacing: .03em; }
    /* 漫游模式：屏幕中心准星（步骤 3） */
    #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
                 border-radius: 50%; display: none; z-index: 14; pointer-events: none;
                 background: rgba(255,255,255,.9); box-shadow: 0 0 4px rgba(0,0,0,.6);
                 transition: transform .12s, background .12s; }
    #crosshair.on { transform: scale(1.9); background: #df8b55; }
    #crossTip { position: fixed; left: 50%; top: calc(50% + 16px); transform: translateX(-50%); z-index: 14;
                display: none; pointer-events: none; color: #fff; font-size: 12px;
                text-shadow: 0 1px 3px rgba(0,0,0,.7); letter-spacing: .05em; }
    .scene-home { position: fixed; top: 16px; left: 16px; z-index: 12; display: flex; align-items: center; gap: 9px;
                  min-height: 44px; padding: 6px 12px 6px 7px; border-radius: 10px; background: #fff;
                  color: #1d2924; text-decoration: none; box-shadow: 0 8px 24px rgba(24,45,32,.15); }
    .scene-home:hover { background: #f2f5f0; }
    .scene-home:focus-visible, #ui button:focus-visible, .scene-help button:focus-visible { outline: 3px solid #89bea0; outline-offset: 3px; }
    .scene-home-mark { display: block; flex: none; width: 32px; height: 32px; }
    .scene-home strong, .scene-home small { display: block; line-height: 1.15; }
    .scene-home strong { font-size: 15px; }
    .scene-home small { margin-top: 3px; color: #526359; font-size: 10px; }
    .scene-help { width: min(430px, calc(100% - 24px)); padding: 24px; border: 0; border-radius: 14px; color: #1d2924; background: #fff; box-shadow: 0 22px 70px rgba(24,45,32,.25); }
    .scene-help::backdrop { background: rgba(20,33,24,.52); }
    .scene-help h2 { margin: 0 0 10px; font-size: 21px; }
    .scene-help p { margin: 0 0 15px; color: #42524a; font-size: 13px; line-height: 1.75; }
    .scene-help button { min-height: 38px; padding: 6px 14px; border: 0; border-radius: 8px; background: #28735a; color: #fff; font: inherit; cursor: pointer; }
    @media (max-width: 600px) {
      #ui { right: 12px; left: 12px; bottom: 12px; flex-wrap: wrap; gap: 8px; }
      #ui input { flex: 1 1 120px; width: auto; }
      #tip { display: none; }
      .scene-home { top: 12px; left: 12px; }
    }
    /* 热区悬浮标签：hover/准星对准时跟随热区 */
    #zoneLabel { position: fixed; display: none; z-index: 13; transform: translate(-50%, -100%);
                 pointer-events: none; white-space: nowrap; padding: 4px 12px; border-radius: 999px;
                 background: rgba(29,41,36,.85); color: #fff; font-size: 12.5px; letter-spacing: .03em;
                 box-shadow: 0 4px 14px rgba(24,45,32,.25); }
    #zoneLabel b { color: #bfe3cd; font-weight: 600; }
    #clock { font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
    /* 热区详情卡（HTML overlay，随热区投影跟随；默认向上弹，上方放不下加 .below 改向下弹） */
    #zoneCard { position: fixed; display: none; z-index: 20; box-sizing: border-box; width: 300px; max-width: calc(100vw - 24px); max-height: 52vh; overflow-y: auto;
                transform: translate(-50%, calc(-100% - 14px));
                background: rgba(255,255,255,.97); border: 1px solid #e3e9e2; border-radius: 12px;
                box-shadow: 0 12px 36px rgba(33,55,42,.16); padding: 14px 16px; font-size: 14px; color: #1d2924; }
    #zoneCard.below { transform: translate(-50%, 14px); }
    #zoneCard .zc-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    #zoneCard .zc-head b { font-size: 17px; }
    #zoneCard .zc-chip { color: #fff; font-size: 12.5px; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
    #zoneCard .zc-x { margin-left: auto; border: 0; background: none; font-size: 20px; color: #65736b; cursor: pointer; }
    #zoneCard .zc-desc { color: #42524a; font-size: 14px; margin-bottom: 8px; line-height: 1.75;
                         overflow-wrap: break-word; word-break: break-word; }
    #zoneCard .zc-meta { color: #65736b; font-size: 13px; margin: 8px 0 0; line-height: 1.6; }
    #zoneCard .zc-foot { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e3e9e2;
                         color: #8a978e; font-size: 12.5px; letter-spacing: .04em; }
    #zoneCard { animation: zc-pop .18s ease-out; }
    @keyframes zc-pop { from { opacity: 0; } to { opacity: 1; } }
    /* —— 漫游模式加大版卡片：更宽、类别色顶条、面板式数据行 —— */
    #zoneCard.walk { width: 384px; max-height: 64vh; padding: 16px 20px 14px; border-radius: 16px;
                     border-top: 4px solid var(--zc, #28735a); font-size: 15px;
                     background: rgba(255,255,255,.98); box-shadow: 0 18px 50px rgba(24,45,32,.24); }
    #zoneCard.walk .zc-head { gap: 10px; margin-bottom: 8px; }
    #zoneCard.walk .zc-head b { font-size: 21px; letter-spacing: .02em; }
    #zoneCard.walk .zc-chip { font-size: 13px; padding: 3px 12px; }
    #zoneCard.walk .zc-x { font-size: 22px; }
    #zoneCard.walk .zc-desc { font-size: 15px; line-height: 1.9; color: #37423c; }
    #zoneCard.walk .zc-meta { font-size: 13.5px; background: #f2f5f0; border: 1px solid #e3e9e2;
                              border-radius: 9px; padding: 8px 12px; margin-top: 10px; }
    #zoneCard.walk .zc-foot { font-size: 13px; margin-top: 10px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/experiences/dumpling/vendor/three.module.js"
    }
  }
  </script>
</head>
<body>
<a class="scene-home" href="/" aria-label="留白 WriteSpace，返回首页"><img class="scene-home-mark" src="/favicon.svg" alt="" aria-hidden="true"><span><strong>留白</strong><small>回到首页</small></span></a>
<div id="tip">左键拖拽旋转 · 滚轮缩放 · 按住滚轮键（中键）拖拽平移</div>
<div id="zoneCard"></div>
<div id="ui">
  <span>时间</span>
  <input id="slider" type="range" min="24" max="108" step="1" value="92">
  <span id="clock">18:48</span>
  <button id="play">播放</button>
  <button id="walkBtn">漫游</button>
  <button id="aboutBtn" type="button">玩法</button>
</div>
<div id="walkHint">已暂停漫游 —— 点击画面继续，按 V 退出</div>
<dialog id="sceneHelp" class="scene-help" aria-labelledby="sceneHelpTitle"><h2 id="sceneHelpTitle">怎样逛这间饺子店</h2><p>拖动画面看街区，移动时间滑杆观察一天中的变化。点击店里的光柱，查看该时段的虚构社区需求。按 V 进入漫游，使用 WASD 移动，靠近光柱后按 E 阅读。</p><p>这里是互动演示沙盘，光柱和需求均为示意数据，并非真实求助。</p><button id="closeSceneHelp" type="button">继续体验</button></dialog>
<div id="crosshair"></div>
<div id="crossTip">按 E 查看详情</div>
<div id="zoneLabel"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from '/experiences/dumpling/vendor/OrbitControls.js';

// === 场景 ===
const scene = new THREE.Scene();

// === 天空（竖向渐变贴在大球内侧，随时间重绘）+ 暖色雾 ===
scene.background = new THREE.Color(0xf3c294);
scene.fog = new THREE.Fog(0xe6a878, 30, 125);
const skyCv = document.createElement('canvas'); skyCv.width = 64; skyCv.height = 512;
const skyCtx = skyCv.getContext('2d');
const skyTex = new THREE.CanvasTexture(skyCv); skyTex.colorSpace = THREE.SRGBColorSpace;
const SKY_STOPS = [0.00, 0.30, 0.55, 0.78, 1.00];      // 色标位置：画布顶 → 球体天顶
function paintSky(cols) {                               // cols：与 SKY_STOPS 对应的 THREE.Color[]
  const g = skyCtx.createLinearGradient(0, 0, 0, 512);
  SKY_STOPS.forEach((p, i) => g.addColorStop(p, cols[i].getStyle()));
  skyCtx.fillStyle = g; skyCtx.fillRect(0, 0, 64, 512);
  skyTex.needsUpdate = true;
}
scene.add(new THREE.Mesh(new THREE.SphereGeometry(220, 32, 16),
  new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false, depthWrite: false })));
// 太阳光晕贴图（径向渐变，加色混合叠成一团暖光）
function haloTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0.00, 'rgba(255,238,200,0.95)');
  g.addColorStop(0.22, 'rgba(255,196,124,0.55)');
  g.addColorStop(0.55, 'rgba(255,150,80,0.18)');
  g.addColorStop(1.00, 'rgba(255,140,70,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// shop：整栋饺子店（含室内、立面、屋顶、雨棚招牌），整体绕 Y 轴转 180°
// 街景 / 地面 / 人行道等属于环境，挂在 scene 上不参与旋转
const shop = new THREE.Group();
shop.rotation.y = Math.PI;      // 店铺整体前后翻转 180°（街道环境不参与旋转）
scene.add(shop);
const room = new THREE.Group();
shop.add(room);

// === 渲染器 ===
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));   // 2 → 1.5：高分屏像素量降 44%，肉眼几乎无差
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;              // 阴影不逐帧重算：光源只随时间轴动，setTime 里按需 needsUpdate
document.body.appendChild(renderer.domElement);

// === 相机：站到街对面的斜前方，保证一进页面就看得见整栋店 ===
// 不写固定坐标：垂直 FOV 固定 55° 时，水平视野随窗口比例变（4:3 的半角只有 34.8°，远窄于 16:9 的 42.8°），
// 写死坐标在窄窗口下一定会切掉边。改成「轮廓点 + 观察方向」在运行时反解出刚好装下的距离。
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);
const VIEW_TARGET = new THREE.Vector3(0, 2.15, -1.0);          // 看向建筑中心：略偏前、略抬高
const VIEW_ELEV = 17 * Math.PI / 180;                          // 俯角：大于屋面坡度(~12°)才看得见瓦顶
const VIEW_AZIM = 16 * Math.PI / 180;                          // 方位：从正面偏开一点，能同时看到一侧墙
const VIEW_DIR = new THREE.Vector3(                            // 相机相对目标的方向（斜前上方）
  Math.cos(VIEW_ELEV) * Math.sin(VIEW_AZIM), Math.sin(VIEW_ELEV), -Math.cos(VIEW_ELEV) * Math.cos(VIEW_AZIM));
const VIEW_PTS = [                                             // 建模轮廓的关键点（世界坐标）
  [6.3, 5.0, 0], [-6.3, 5.0, 0],                                                    // 屋脊两端（含吻兽）
  [6.3, 3.82, 6.05], [-6.3, 3.82, 6.05], [6.3, 3.82, -6.05], [-6.3, 3.82, -6.05],    // 四角檐口
  [6.45, -0.06, 5.45], [-6.45, -0.06, 5.45], [6.45, -0.06, -5.45], [-6.45, -0.06, -5.45], // 基座四角
  [6.5, 2.95, -6.65], [-6.5, 2.95, -6.65], [5.0, 2.9, -6.5], [-5.0, 2.9, -6.5],      // 雨棚前沿与立柱顶
  [3.35, 1.35, -5.9], [-3.35, 1.35, -5.9], [4.9, 1.7, -7.0], [-5.2, 1.4, -7.9],      // 盆栽 / 立牌 / 三轮车
  [3.2, 4.84, -7.6], [3.2, 4.34, -8.3], [0, 0, -6.9],                                // 路灯杆顶 / 灯头 / 门前地面
].map(a => new THREE.Vector3(...a));
const _v = new THREE.Vector3(), _r = new THREE.Vector3(), _u = new THREE.Vector3(), _f = new THREE.Vector3();
function fitDistance(margin = 1.35) {                          // 给街景留出呼吸空间，同时保证建筑完整入镜
  const tanV = Math.tan(camera.fov * Math.PI / 360), tanH = tanV * camera.aspect;
  _f.copy(VIEW_DIR).negate();                                  // 视线方向 = -VIEW_DIR
  _r.crossVectors(_f, camera.up).normalize();                  // 相机右轴
  _u.crossVectors(_r, _f).normalize();                         // 相机上轴
  for (let r = 8; r <= 60; r += 0.25) {
    let ok = true;
    for (const p of VIEW_PTS) {
      _v.copy(p).sub(VIEW_TARGET).addScaledVector(VIEW_DIR, -r);   // 相机坐标系下的偏移
      const d = _v.dot(_f);                                        // 深度
      if (d <= 0.1 || Math.abs(_v.dot(_r)) > d * tanH / margin
                   || Math.abs(_v.dot(_u)) > d * tanV / margin) { ok = false; break; }
    }
    if (ok) return r;
  }
  return 60;
}
function placeCamera() {                                       // 用户没手动转过视角前，resize 也会重新取景
  camera.position.copy(VIEW_TARGET).addScaledVector(VIEW_DIR, fitDistance());
  camera.lookAt(VIEW_TARGET);
}
placeCamera();

// === 控制器 ===
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(VIEW_TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 46;                          // 初始距离已到 ~13，上限要跟着放宽
controls.maxPolarAngle = Math.PI * 0.495;           // 不穿到地面以下
// 平移改为按住中键（滚轮键）拖拽：左键旋转、中键平移，右键不再有动作（避免误拖画面）
// touch 保持默认：单指旋转、双指缩放+平移
controls.mouseButtons = {
  LEFT: THREE.MOUSE.ROTATE,
  MIDDLE: THREE.MOUSE.PAN,
  RIGHT: null                                     // null → OrbitControls 内部落到 STATE.NONE
};
// Windows / Linux 浏览器对中键的默认行为是「自动滚动 / 粘贴」，必须屏蔽掉拖拽平移才会生效
renderer.domElement.addEventListener('pointerdown', e => { if (e.button === 1) e.preventDefault(); });
renderer.domElement.addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });
controls.update();
let userMoved = false;                              // 用户动过视角后就不再自动取景，免得 resize 跳画面
controls.addEventListener('start', () => { userMoved = true; });

// === 相机补间管理器（开场运镜 / orbit↔walk 过渡 / 双击聚焦共用）===
// useTarget 模式：补间相机位置 + controls.target（orbit 系）；否则 slerp 四元数（walk 系）
const camTween = { active: false, t: 0, dur: 0.8,
  fromP: new THREE.Vector3(), toP: new THREE.Vector3(),
  fromQ: new THREE.Quaternion(), toQ: new THREE.Quaternion(),
  fromT: new THREE.Vector3(), toT: new THREE.Vector3(),
  useTarget: false, onDone: null };
function startCamTween(toP, { toQ = null, toT = null, dur = 0.8, onDone = null } = {}) {
  camTween.active = true; camTween.t = 0; camTween.dur = dur;
  camTween.fromP.copy(camera.position); camTween.toP.copy(toP);
  camTween.fromQ.copy(camera.quaternion);
  camTween.useTarget = !!toT;
  if (toT) { camTween.fromT.copy(controls.target); camTween.toT.copy(toT); }
  if (toQ) camTween.toQ.copy(toQ);
  camTween.onDone = onDone;
}
function updateCamTween(dt) {
  if (!camTween.active) return false;
  camTween.t += dt / camTween.dur;
  const u = Math.min(camTween.t, 1);
  const k = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;   // easeInOutCubic
  camera.position.lerpVectors(camTween.fromP, camTween.toP, k);
  if (camTween.useTarget) {
    controls.target.lerpVectors(camTween.fromT, camTween.toT, k);
    camera.lookAt(controls.target);
  } else camera.quaternion.slerpQuaternions(camTween.fromQ, camTween.toQ, k);
  if (u >= 1) { camTween.active = false; const f = camTween.onDone; camTween.onDone = null; if (f) f(); }
  return true;
}

// Start directly in the usable scene; the former splash screen is omitted.
let introDone = true;
controls.enabled = true;
controls.update();

// === 第一人称漫游模式（walk）：V 键 / 按钮切换，WASD 移动 + PointerLock 转头（步骤 1：暂无碰撞） ===
camera.rotation.order = 'YXZ';                      // walk 模式按 yaw/pitch 直接写欧拉角
const tipEl = document.getElementById('tip');
const TIP_ORBIT = tipEl.textContent;
const walkBtn = document.getElementById('walkBtn');
const walkHint = document.getElementById('walkHint');
const crosshair = document.getElementById('crosshair');
const crossTip = document.getElementById('crossTip');
let mode = 'orbit';                                 // 'orbit' 第三人称（默认）/ 'walk' 第一人称漫游
const walkState = { yaw: 0, pitch: 0, keys: new Set(), vx: 0, vz: 0, bob: 0 };
let orbitSnapshot = null;                           // 切回 orbit 时恢复原机位

function enterWalk() {
  if (selectedZone >= 0) closeZoneCard();             // 先关卡再切模式（反过来会触发 walk 的关卡自动回锁）
  if (hoverZone >= 0) setHoverZone(-1);               // 清掉 orbit 残留的悬停高亮与标签
  mode = 'walk'; userMoved = true;                  // 之后 resize 不许再自动取景
  orbitSnapshot = { pos: camera.position.clone(), tgt: controls.target.clone() };
  controls.enabled = false;
  const start = shop.localToWorld(new THREE.Vector3(0, 1.35, 7));   // 起点：门口人眼高度（shop 局部）
  const look = shop.localToWorld(new THREE.Vector3(0, 1.35, 0));    // 面朝店内
  const d = look.sub(start).normalize();
  walkState.yaw = Math.atan2(-d.x, -d.z);
  walkState.pitch = Math.asin(THREE.MathUtils.clamp(d.y, -1, 1));
  walkState.keys.clear();
  walkState.vx = walkState.vz = walkState.bob = 0;    // 速度/步态清零，免得带着上次的惯性进来
  const toQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(walkState.pitch, walkState.yaw, 0, 'YXZ'));
  startCamTween(start, { toQ, dur: 0.8 });            // 步骤 4：从当前机位 0.8s 平滑飞到门口
  walkBtn.textContent = '退出漫游'; walkBtn.classList.add('on');
  tipEl.textContent = 'WASD 移动 · Shift 加速 · 鼠标转头 · V 退出漫游';
  renderer.domElement.requestPointerLock();
}
function exitWalk() {
  if (document.pointerLockElement) document.exitPointerLock();
  walkBtn.textContent = '漫游'; walkBtn.classList.remove('on');
  walkHint.style.display = 'none';
  crosshair.style.display = 'none'; crosshair.classList.remove('on'); crossTip.style.display = 'none';
  tipEl.textContent = TIP_ORBIT;
  mode = 'orbit';
  if (orbitSnapshot) {                                // 0.8s 飞回快照机位，结束才交还 OrbitControls
    startCamTween(orbitSnapshot.pos, { toT: orbitSnapshot.tgt, dur: 0.8,
      onDone: () => { controls.enabled = true; controls.update(); } });
  } else controls.enabled = true;

const CAM_R = 0.3;
const COLLIDERS = [
  // —— 室内：三张桌子（桌面 1.5 + 两侧长凳）——
  { c: [2.6, -1.2], r: 1.15 }, { c: [-1.5, -2.6], r: 1.15 }, { c: [-2.7, 1.5], r: 1.15 },

  { c: [-4.33, -5.9], r: 0.5 }, { c: [4.9, -7.0], r: 0.5 },
  // —— 室外：三轮车 / 路灯杆 / 侧墙根杂物（泔水桶、箱垛、粮袋、竹梯、油桶、纸箱） ——
  { c: [-5.2, -7.9], r: 1.2 }, { c: [3.2, -7.6], r: 0.15 },
  { c: [7.15, -3.3], h: [0.66, 0.48] }, { c: [7.0, -1.35], r: 0.5 }, { c: [6.9, 0.15], r: 0.5 },
  { c: [6.9, 2.9], r: 0.4 }, { c: [-6.78, -1.85], r: 0.35 }, { c: [-6.95, -2.95], r: 0.5 },
  { c: [-6.9, -4.05], r: 0.5 },
];
// 活动范围（矩形的并集）：室内 + 门洞（净宽 3.4）+ 门前院落与街面；不进后巷深处
const RANGE_RECTS = [
  { x: 0, z: 0, hx: 5.5, hz: 4.55 },        // 室内（墙面内缩一个半径）
  { x: 0, z: -5.5, hx: 1.4, hz: 1.15 },     // 门洞
  { x: 0, z: -7.0, hx: 9.0, hz: 2.5 },      // 门前（覆盖盆栽、路灯、三轮车）
];
function resolveCollision(p) {
  for (let round = 0; round < 2; round++) {           // 推离→钳范围→再推离，防角落互相顶出
    for (let iter = 0; iter < 3; iter++) {            // 圆推离迭代 2~3 次
      for (const o of COLLIDERS) {
        if (o.r) {                                    // 圆碰撞体
          const dx = p.x - o.c[0], dz = p.z - o.c[1];
          const rr = o.r + CAM_R, d2 = dx * dx + dz * dz;
          if (d2 < rr * rr && d2 > 1e-8) {
            const d = Math.sqrt(d2), k = (rr - d) / d;
            p.x += dx * k; p.z += dz * k;
          }
        } else {                                      // AABB：沿穿透浅的一侧推出
          const dx = p.x - o.c[0], dz = p.z - o.c[1];
          const px = o.h[0] + CAM_R - Math.abs(dx), pz = o.h[1] + CAM_R - Math.abs(dz);
          if (px > 0 && pz > 0) {
            if (px < pz) p.x += dx >= 0 ? px : -px; else p.z += dz >= 0 ? pz : -pz;
          }
        }
      }
    }
    let bx = p.x, bz = p.z, bd = Infinity;            // 钳到并集中最近的矩形
    for (const R of RANGE_RECTS) {
      const cx = Math.max(R.x - R.hx, Math.min(p.x, R.x + R.hx));
      const cz = Math.max(R.z - R.hz, Math.min(p.z, R.z + R.hz));
      const d = (p.x - cx) * (p.x - cx) + (p.z - cz) * (p.z - cz);
      if (d < bd) { bd = d; bx = cx; bz = cz; }
    }
    p.x = bx; p.z = bz;
  }
}

function updateWalk(dt) {
  const f = (walkState.keys.has('f') ? 1 : 0) - (walkState.keys.has('b') ? 1 : 0);
  const r = (walkState.keys.has('r') ? 1 : 0) - (walkState.keys.has('l') ? 1 : 0);
  // 目标速度 → 惯性平滑：起步有加速、松键有滑停，不再"瞬间启停"
  const speed = walkState.keys.has('run') ? 3.2 : 1.6;    // 走 1.6 m/s、跑 3.2 m/s
  const fx = -Math.sin(walkState.yaw), fz = -Math.cos(walkState.yaw);   // 前向（yaw 朝向）
  const rx = -fz, rz = fx;                                // 右向 = 前向 × 上
  const len = Math.hypot(f, r) || 1;
  const wishX = (fx * f + rx * r) / len * speed, wishZ = (fz * f + rz * r) / len * speed;
  const accel = (f || r) ? 9 : 13;                        // 停步比起步收得更快，贴真人手感
  walkState.vx += (wishX - walkState.vx) * Math.min(1, accel * dt);
  walkState.vz += (wishZ - walkState.vz) * Math.min(1, accel * dt);
  camera.position.x += walkState.vx * dt;
  camera.position.z += walkState.vz * dt;
  // 步伐驱动的头部律动：步频随速度，幅度跑步略大；停下时淡出
  const planar = Math.hypot(walkState.vx, walkState.vz);
  walkState.bob += planar * dt * 3.4;                     // ≈ 步幅 0.6m 一步一沉
  const fade = Math.min(1, planar / 0.7);
  const amp = (planar > 2.2 ? 0.030 : 0.022) * fade;
  const bobY = Math.sin(walkState.bob * 2) * amp;         // 每步一次上下
  const roll = Math.sin(walkState.bob) * 0.010 * fade;    // 左右轻微侧倾
  // 人眼高度固定：室内地板 0 → 1.35；室外地面 -0.06 → 1.29，门槛 2cm 平滑过渡；bob 叠在目标高度上
  const inside = Math.abs(camera.position.x) <= 5.8 && Math.abs(camera.position.z) <= 4.85;
  const targetY = (inside ? 1.35 : 1.29) + bobY;
  camera.position.y += (targetY - camera.position.y) * Math.min(1, dt * 10);
  resolveCollision(camera.position);                  // 步骤 2：碰撞推离 + 活动范围钳制
  camera.rotation.set(walkState.pitch, walkState.yaw, roll);
}

function streetLamp(parent, px, pz, ry = 0) {
  const g = new THREE.Group(); g.position.set(px, GY, pz); g.rotation.y = ry; parent.add(g);
  addCyl(g, matBase, 0.30, 0.34, 0.16, 8, 0, 0.08, 0);                    // 混凝土基座
  addCyl(g, matDark, 0.20, 0.22, 0.05, 8, 0, 0.185, 0);                   // 法兰盘

  addBox(g, matDark, 0.10, 0.24, 0.03, 0, 0.80, -0.128);                  // 检修小门（朝街一侧）
  addBox(g, matPole, 0.08, 0.08, 0.74, 0, ARM_Y, ARM_Z / 2);              // 悬臂
  const brace = addBox(g, matPole, 0.05, 0.66, 0.05, 0, ARM_Y - 0.335, -0.255);
  brace.rotation.x = 2.618;                                               // 斜撑：由杆身撑向悬臂
  addCyl(g, matDark, 0.09, 0.09, 0.30, 8, 0, ARM_Y - 0.19, ARM_Z);        // 灯颈
  addCyl(g, matDark, 0.36, 0.24, 0.20, 10, 0, HEAD_Y, ARM_Z);             // 灯罩
  const bulb = new THREE.Mesh(new THREE.CircleGeometry(0.22, 12), matBulb);
  bulb.rotation.x = Math.PI / 2; bulb.position.set(0, BULB_Y, ARM_Z); g.add(bulb);
  const knot = new THREE.Group(); knot.position.set(0, ARM_Y - 0.05, ARM_Z * 0.62); g.add(knot);  // 中国结
  addBox(knot, matBand, 0.02, 0.14, 0.02, 0, -0.07, 0);
  addCyl(knot, M(0xb9432f), 0.075, 0.075, 0.12, 8, 0, -0.20, 0);
  addCyl(knot, M(0xd4b483), 0.035, 0.012, 0.10, 6, 0, -0.31, 0);
  return { g, bulb, bulbPos: new THREE.Vector3(px, GY + BULB_Y, pz + ARM_Z) };
}

const lerpN = (a, b, k) => a + (b - a) * k;

function applyTime(t) {
  let i = 0;
  while (i < KEYS.length - 2 && t > KEYS[i + 1].t) i++;
  const a = KEYS[i], b = KEYS[i + 1];
  const k = Math.min(Math.max((t - a.t) / (b.t - a.t), 0), 1);

  // 天空 / 雾 / 背景
  for (let s = 0; s < SKY_STOPS.length; s++) skyCols[s].copy(a.cSky[s]).lerp(b.cSky[s], k);
  paintSky(skyCols);
  scene.background.copy(skyCols[4]);
  scene.fog.color.copy(cFog.copy(a.cFog).lerp(b.cFog, k));
  scene.fog.near = lerpN(a.fogN, b.fogN, k); scene.fog.far = lerpN(a.fogF, b.fogF, k);

  // 天体位置：高度过地平线后镜像到另一侧（当作月亮继续提供一点方向光）
  const elev = MAX_ELEV * Math.sin(Math.PI * t), below = elev < 0;
  const az = AZ_SUNSET + (t - 0.92) * AZ_SPAN + (below ? Math.PI : 0);

  disc.scale.setScalar(lerpN(a.discS, b.discS, k));
  halo.position.copy(sunDir).multiplyScalar(198); halo.lookAt(0, 0, 0);
  halo.material.color.copy(disc.material.color);
  halo.material.opacity = lerpN(a.haloO, b.haloO, k);

  ambient.color.copy(cAmb.copy(a.cAmb).lerp(b.cAmb, k)); ambient.intensity = lerpN(a.ambI, b.ambI, k);
  hemi.color.copy(cHemiS.copy(a.cHemiS).lerp(b.cHemiS, k));
  hemi.groundColor.copy(cHemiG.copy(a.cHemiG).lerp(b.cHemiG, k));
  hemi.intensity = lerpN(a.hemiI, b.hemiI, k);
  keyLight.intensity = lerpN(a.keyI, b.keyI, k);
  lanternGain = lerpN(a.lant, b.lant, k);

  // 街边路灯：日落后由它接管屋外照明
  lampGain = lerpN(a.lampG, b.lampG, k);
  lampSpot.intensity = LAMP_I * lampGain;
  lampSpot.castShadow = lampGain > 0.02;              // 白天完全不付阴影代价
  matBulb.opacity = 0.15 + lampGain * 0.85;           // 灯罩里的发光面同步亮起
  coneMat.uniforms.uOpacity.value = lampGain * 0.09;  // 加色几何很吃强度，取值必须小（双面叠加已翻倍）
  lampPool.material.opacity = lampGain * 0.32;
  if (zoneVisuals) updateZones(dayT);   // 热区热度随时间轴刷新（var 提升，applyTime 早于本块执行时安全跳过）
}

function heat(zoneId, t) {
  let h = 0;
  for (const n of NEEDS) {
    if (n.zoneId !== zoneId || n.publishT > t) continue;      // 还没发布的不计入
    h += n.urgency * Math.exp(-(t - n.publishT) / HEAT_TAU) * (1 - n.joined / n.capacity);
  }
  return h;
}
function heatAll(t) {                                          // 归一化到 0~1
  const raw = ZONES.map(z => heat(z.id, t));
  const max = Math.max(...raw, 1e-6);
  return ZONES.map((z, i) => ({ zone: z, raw: raw[i], norm: raw[i] / max }));

// 光柱着色器：uv.y=0 在锥底、1 在锥尖（继承 CylinderGeometry 约定），底部实、顶端散尽
function zoneBeamMaterial(color) {
  return new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(color) }, uOpacity: { value: 0 } },
    vertexShader: `varying vec2 vUv;
      void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uOpacity; varying vec2 vUv;
      void main(){
        float a = mix(0.8, 0.0, vUv.y);
        a *= smoothstep(0.0, 0.08, vUv.y);   // 贴地微收，不与地面硬接
        gl_FragColor = vec4(uColor, a * uOpacity);
      }`,
    transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.DoubleSide, fog: false

}

  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  if (playing) {                                              // 自动走时间：约 2 分钟过完一天
    dayT += dt * 0.0085;
    if (dayT > 1.08) dayT = 0.24;
    setTime(dayT);
  }

  lanterns.forEach(({ g, phase, light, mat }) => {            // 灯笼摆动 + 随入夜点亮
    g.rotation.z = Math.sin(t * 0.7 + phase) * 0.035;
    g.rotation.x = Math.cos(t * 0.55 + phase) * 0.025;
    light.intensity = (2.6 + Math.sin(t * 1.3 + phase) * 0.4) * lanternGain;
    mat.emissiveIntensity = 0.06 + lanternGain * 0.55;
  });
  stoveLight.intensity = 4.5 + Math.sin(t * 2.1) * 1.2;       // 灶火呼吸

  if (selectedZone >= 0 && zoneVisuals) {                     // 详情卡跟随热区（取代理圆柱的世界坐标，自动含店铺翻转）
    zonePickers[selectedZone].getWorldPosition(_zv);
    _zv.y += 1.8; _zv.project(camera);
    let cx = (_zv.x * 0.5 + 0.5) * innerWidth, cy = (-_zv.y * 0.5 + 0.5) * innerHeight;
    const cw = zoneCard.offsetWidth, ch = zoneCard.offsetHeight;    // 按实测尺寸定位，保证完整不出屏
    cx = Math.min(Math.max(cx, cw / 2 + 8), innerWidth - cw / 2 - 8);
    const above = cy - 14 - ch >= 8;                                // 上方放得下才向上弹，否则翻到锚点下方
    zoneCard.classList.toggle('below', !above);
    cy = above ? Math.min(Math.max(cy, ch + 14 + 8), innerHeight - 8)
               : Math.min(Math.max(cy, 8), innerHeight - ch - 14 - 8);
    zoneCard.style.left = cx + 'px';
    zoneCard.style.top = cy + 'px';
  }

  if (mode === 'walk' && document.pointerLockElement === renderer.domElement && selectedZone < 0) {
    zoneRay.setFromCamera(_CENTER, camera);                       // 准星拾取：从屏幕中心发射
    const hit = zoneRay.intersectObjects(zonePickers, false)[0];
    let zi = (hit && hit.distance <= 4.5) ? hit.object.userData.zoneIndex : -1;   // 直接命中：4.5m 内
    if (zi < 0) {                                                 // 角度容差：准星 6° 内的最近热区也算对准
      camera.getWorldDirection(_vf);
      let best = 0.105;                                           // ≈6°，越小越优先
      zonePickers.forEach((p, i) => {
        p.getWorldPosition(_zv); _zv.y = zoneVisuals[i].baseY + 1.2;
        _zv.sub(camera.position);
        const d = _zv.length();
        if (d > 4.5 || d < 0.4) return;
        const a = _vf.angleTo(_zv.normalize());
        if (a < best) { best = a; zi = i; }
      });
    }
    if (zi !== hoverZone) setHoverZone(zi);
    crosshair.classList.toggle('on', zi >= 0);
    crossTip.style.display = zi >= 0 ? 'block' : 'none';
  }

  // 悬浮标签跟随 + 对准热区的呼吸脉冲
  if (hoverZone >= 0 && selectedZone < 0) {
    const v = zoneVisuals[hoverZone];
    zonePickers[hoverZone].getWorldPosition(_zv);
    _zv.y = v.baseY + v.beam.scale.y + 0.35;                      // 标签浮在光柱顶上方
    const facing = _zv.clone().sub(camera.position).dot(camera.getWorldDirection(_vf)) > 0;
    _zv.project(camera);
    if (facing && Math.abs(_zv.x) < 1.05 && Math.abs(_zv.y) < 1.05) {
      zoneLabel.style.left = (_zv.x * 0.5 + 0.5) * innerWidth + 'px';
      zoneLabel.style.top = (-_zv.y * 0.5 + 0.5) * innerHeight + 'px';
      zoneLabel.style.display = 'block';
    } else zoneLabel.style.display = 'none';
    if (v.beam.visible) {                                         // 脉冲：光柱呼吸 + 感应环明灭
      v.beamMat.uniforms.uOpacity.value = v._baseOp * (1 + 0.18 * Math.sin(t * 5));
      v.ringMat.opacity = 0.45 + 0.2 * Math.sin(t * 5);
    }
  } else zoneLabel.style.display = 'none';

  if (updateCamTween(dt)) {                           // 运镜补间期间：相机由补间接管，跳过 walk/orbit 控制
  } else if (mode === 'walk') updateWalk(dt); else controls.update();    // walk 模式下 OrbitControls 已禁用
  renderer.render(scene, camera);
}
animate();

const sceneHelp = document.getElementById('sceneHelp');
document.getElementById('aboutBtn').addEventListener('click', () => {
  if (document.pointerLockElement) document.exitPointerLock();
  sceneHelp.showModal();
});
document.getElementById('closeSceneHelp').addEventListener('click', () => sceneHelp.close());

// === 窗口自适应 ===
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (mode === 'orbit' && !userMoved && introDone) placeCamera();   // walk 模式/开场运镜期间 resize 不得重置视角
});
document.body.dataset.sceneReady = 'true';
</script>
</body>
</html>
